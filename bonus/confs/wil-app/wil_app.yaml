apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil-app-deployment
  # namespace: dev
  labels:
    app: wil-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil-app
  template:
    metadata:
      labels:
        app: wil-app
    spec:
      containers:
        - name: wil-app
          image: wil42/playground:v1
          ports:
            - containerPort: 8888

---

apiVersion: v1
kind: Service
metadata:
  name: wil-app-service
spec:
  type: ClusterIP
  selector:
    app: wil-app
  ports:
  - port: 80
    targetPort: 8888
    name: http
    protocol: TCP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wil-app-ingress
  namespace: gitlab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: wil.cadet.in.th
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wil-app-service
                port:
                  number: 80