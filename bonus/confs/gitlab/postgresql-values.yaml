global:
  defaultStorageClass: "postgresql-pv"

auth:
  database: "gitlabhq_production"
  username: "gitlab"
  existingSecret: "my-secret"

volumePermissions:
  enabled: true

primary:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"

  extendedConfiguration: |
    max_locks_per_transaction = 256
    max_connections = 200
