apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: minio-insecure-transport
  namespace: gitlab
spec:
  insecureSkipVerify: true

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-ingressroute
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio-console.cadet.in.th`)
      kind: Rule
      services:
        - name: primary-object-store-console
          port: 9443
          scheme: https
          serversTransport: minio-insecure-transport
  tls:
    secretName: gitlab-tls