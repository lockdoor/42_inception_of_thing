apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-apps-ingress
spec:
  tls:
    - hosts:
      - mymongo.com
      secretName: app-tls
  rules:
    - host: mymongo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mongo-express-service
                port:
                  number: 8081
